name: Dancha Release

on:
  push:
    branches:
      - main
      - feat/cli-project-scaffolder

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  release:
    name: Publish Dancha Packages
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 9

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup pnpm cache
        uses: actions/cache@v3
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm build --filter @dancha/cli --filter @dancha/core --filter @dancha/logger

      - name: Create Release Pull Request or Publish to npm
        id: changesets
        uses: changesets/action@v1
        with:
          publish: pnpm release
          commit: 'chore(release): publish packages'
          title: 'chore(release): bump versions'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Tag Release
        if: steps.changesets.outputs.published == 'true'
        run: |
          git config user.email "action@github.com"
          git config user.name "GitHub Action"
          git tag -l | grep -E "^@dancha" | xargs -I {} git push origin {}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
